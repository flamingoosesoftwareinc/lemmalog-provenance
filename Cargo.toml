[package]
name = "lemmalog"
version = "0.1.0"
edition = "2021"
description = "A Datalog engine for LLM context management: bi-temporal, provenance-annotated, incrementally maintained."
license = "MIT"

[dependencies]
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
serde_json = { version = "1", optional = true }
ureq = { version = "2", optional = true }

[dev-dependencies]
insta = "=1.48.0"

[[bin]]
name = "lemmalog-mcp"
required-features = ["mcp"]

[[bin]]
name = "lemmalog-bench"
required-features = ["llm"]

[[example]]
name = "lmstudio"
required-features = ["llm"]

[[example]]
name = "llm_rules"
required-features = ["llm"]

[[example]]
name = "longmemeval"
required-features = ["llm"]

[features]
# Real-model integration: OpenAI-compatible chat + embeddings (LM Studio,
# llama.cpp server, OpenAI, etc.). Enable with --features llm.
llm = ["dep:ureq", "dep:serde_json"]
# MCP server binary (Model Context Protocol over stdio) for agent CLIs
# (Claude Code, Kimi CLI, ...). Needs only serde_json.
mcp = ["dep:serde_json"]
